
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domasentrix"
version = "0.1.0"
description = "Python-powered domain security configuration auditing and reporting."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

authors = [
    { name = "Bravin M. Ouma" }
]

keywords = [
    "python",
    "cybersecurity",
    "domain-audit",
    "tls",
    "dns",
    "security-headers",
    "infrastructure"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Security"
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "pydantic>=2.9",
    "dnspython>=2.6,<3.0",
    "certifi>=2024.2.2",
    "httpx>=0.27,<1.0",
    "httpcore>=1.0.2,<2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.10"
]

[project.scripts]
domasentrix = "domasentrix.cli:app"

[project.urls]
Homepage = "https://github.com/bmcouma/domasentrix"
Repository = "https://github.com/bmcouma/domasentrix"
Issues = "https://github.com/bmcouma/domasentrix/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/domasentrix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
